<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230E1320'/%3E%3Cpath d='M3.5 12c2.5 0 2-4 4.5-4s2-4 4.5-4' fill='none' stroke='%23F2B544' stroke-width='1.8' stroke-linecap='round' stroke-dasharray='0.1 3'/%3E%3Ccircle cx='12.5' cy='4' r='1.6' fill='%23F2B544'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Sessions by folder">
    <div class="side-head">
      <a class="brand" href="#" aria-label="trail home">
        <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
          <path class="mark-path" d="M3.5 15.5c3.5 0 2.5-5.5 6.5-5.5s3-5.5 6.5-5.5"/>
          <circle class="mark-dot" cx="16.5" cy="4.5" r="2.1"/>
          <circle class="mark-start" cx="3.5" cy="15.5" r="1.5"/>
        </svg>
        <span>trail</span>
      </a>
      <button class="icon-btn" id="refresh" title="Rescan session folders" aria-label="Rescan session folders">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75M13.2 2.6v2.6h-2.6"/></svg>
      </button>
    </div>
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2 13.5 13.5"/></svg>
      <input id="q" type="search" placeholder="Filter sessions" autocomplete="off" spellcheck="false" aria-label="Filter sessions by name, prompt, folder or branch">
      <kbd class="kbd" id="q-hint">/</kbd>
    </div>
    <div class="providers" id="providers" role="group" aria-label="Show providers"></div>
    <nav class="tree" id="tree"></nav>
    <button class="side-foot" id="palette-open">
      <span>Jump to a session</span><span class="keys"><kbd class="kbd" id="mod-key">⌘</kbd><kbd class="kbd">K</kbd></span>
    </button>
  </aside>

  <main class="main" id="main">
    <button class="icon-btn menu" id="menu" aria-label="Show folders">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
    </button>
    <div id="view" class="view"></div>
  </main>
</div>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Jump to a session">
    <div class="palette-input">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2 13.5 13.5"/></svg>
      <input id="palette-q" placeholder="Search every session by name, prompt or folder" autocomplete="off" spellcheck="false" aria-label="Search sessions" aria-controls="palette-list">
      <kbd class="kbd">esc</kbd>
    </div>
    <div class="palette-list" id="palette-list" role="listbox"></div>
  </div>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
